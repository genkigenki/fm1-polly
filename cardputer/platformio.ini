; SPDX-License-Identifier: GPL-3.0-only
; Polly on the original M5Stack Cardputer (StampS3, 8 MB, no PSRAM): fm1-base's platform on the mvave-to-cardputer
; board layer (src/cp_fm1base*.c[pp], lib/mvave_cardputer). Build only; install into an M5Launcher slot.
; First: the generated headers in ../build/gen (base/tools/gen_font.py, gen_words.py; see CARDPUTER.md).

[platformio]
src_dir = src

[env:cardputer]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
lib_deps = m5stack/M5Cardputer
lib_extra_dirs = lib
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    -DCP_APP_STORE_NS=\"polly\"
    -DEAS_POOL_BYTES=32768
    -DQB_MAXSTYLES=1
    -DQB_RECMAX=64
    -DQB_MAXN=1
    -DQB_MAXC=1
    -DQB_MAXPH=1
    -I../app
    -I../app/dsp
    -I../app/dsp/eas
    -I../base/include
    -I../base/device
    -I../base/lib
    -I../build/gen
    -ffp-contract=off
    -Wno-unused-function
    -Wno-unused-variable
    -Wno-unused-but-set-variable
    -Wl,-T$PROJECT_DIR/src/cp_pool.ld
; Polly's own list of separately compiled units (app/fm1.toml o2)
build_src_filter =
    +<*>
    +<../../app/dsp/gm.c>
    +<../../app/dsp/chords.c>
    +<../../app/dsp/xpose.c>
    +<../../app/dsp/arr.c>
    +<../../app/dsp/loops.c>
    +<../../app/dsp/leads.c>
    +<../../app/dsp/notes.c>
    +<../../app/dsp/templates.c>
    +<../../app/dsp/qydec.c>
    +<../../app/dsp/qybank.c>
    +<../../app/dsp/eas/eas_chorus.c>
    +<../../app/dsp/eas/eas_chorusdata.c>
    +<../../app/dsp/eas/eas_config.c>
    +<../../app/dsp/eas/eas_data.c>
    +<../../app/dsp/eas/eas_filter.c>
    +<../../app/dsp/eas/eas_host_fm1.c>
    +<../../app/dsp/eas/eas_math.c>
    +<../../app/dsp/eas/eas_midi.c>
    +<../../app/dsp/eas/eas_mididata.c>
    +<../../app/dsp/eas/eas_mixbuf.c>
    +<../../app/dsp/eas/eas_mixer.c>
    +<../../app/dsp/eas/eas_pan.c>
    +<../../app/dsp/eas/eas_pcm.c>
    +<../../app/dsp/eas/eas_pcmdata.c>
    +<../../app/dsp/eas/eas_public.c>
    +<../../app/dsp/eas/eas_reverb.c>
    +<../../app/dsp/eas/eas_reverbdata.c>
    +<../../app/dsp/eas/eas_smf.c>
    +<../../app/dsp/eas/eas_smfdata.c>
    +<../../app/dsp/eas/eas_sndlibmgt.c>
    +<../../app/dsp/eas/eas_voicemgt.c>
    +<../../app/dsp/eas/eas_wtengine.c>
    +<../../app/dsp/eas/eas_wtsynth.c>
    +<../../app/dsp/eas/wt_200k_G.c>
extra_scripts = post:tools/copy_bin.py
